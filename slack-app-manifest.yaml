# slack-tui — Slack app manifest
#
# Setup:
#   1. https://api.slack.com/apps → Create New App → From an app manifest
#   2. Pick your workspace → paste this YAML → Next → Create.
#   3. Basic Information → App-Level Tokens → Generate Token and Scopes:
#        name "socket", scope connections:write → Generate → copy the xapp-… token.
#   4. Install App → Install to Workspace → Allow.
#   5. In Slack, `/invite @slack-tui` in any channel you want live (Socket Mode
#      only streams channels/DMs the app is a member of; personal DMs are polled).
#
# You only need your own app for Socket Mode (live unread) — a plain install
# signs in with `slack-tui login` out of the box, no app and no credentials.
#
# Sign-in is always PKCE and never uses a client secret: Slack rejects a loopback
# redirect without a code_challenge ("Must use PKCE to redirect to a non-web
# URI"). To sign in against this app instead of the built-in one, set
# SLACK_CLIENT_ID (Basic Information -> App Credentials) or put it in
# ~/.config/slack-tui/oauth.json. No secret required, or accepted.
#
# The bot scopes below are NOT obtainable through that sign-in — "Bot scopes are
# not allowed when redirecting to a non-web URI." They are granted by installing
# the app (step 4), and you copy the resulting Bot User OAuth Token (xoxb-...)
# by hand, exactly like the app-level token in step 3. Both go in the onboarding
# token form or SLACK_BOT_TOKEN / SLACK_APP_TOKEN.
#
# There is deliberately no `pkce_enabled: true` here. The setting is a one-way
# switch (it cannot be turned off without contacting Slack support), and it
# proved unnecessary: a PKCE sign-in against an app with the setting OFF renders
# the consent page normally, so the wire protocol is what Slack enforces, not
# the app toggle.

display_information:
  name: slack-tui
  description: A keyboard-first terminal Slack client
  background_color: "#0d1117"

features:
  bot_user:
    display_name: slack-tui
    always_online: false

oauth_config:
  # Loopback targets for `slack-tui login`. It binds the first free port in this
  # range, so all of them must be registered — Slack matches the redirect URL by
  # prefix, and the port is part of that prefix.
  redirect_urls:
    - http://localhost:9899/callback
    - http://localhost:9900/callback
    - http://localhost:9901/callback
    - http://localhost:9902/callback
    - http://localhost:9903/callback
  scopes:
    user:
      - channels:history
      - channels:read
      - channels:write       # browse & join channels + mark public channels read
      - groups:history
      - groups:read
      - groups:write         # mark private channels read (conversations.mark)
      - im:history
      - im:read
      - im:write             # open DMs + mark DMs read (conversations.mark)
      - mpim:history
      - mpim:read
      - mpim:write           # mark group DMs read (conversations.mark)
      - users:read
      - chat:write
      - files:read            # download files
      - files:write           # attach/upload files
      - canvases:read         # read Canvas sections
      - canvases:write        # create and edit Canvases
      - reactions:read
      - reactions:write       # add/remove reactions (`a`)
      - users:write           # set presence (active/away)
      - dnd:write             # Do Not Disturb (snooze)
      - users.profile:write   # custom status message
      - search:read           # workspace message search (`s`)
    bot:
      - channels:history
      - channels:read
      - groups:history
      - im:history
      - mpim:history
      - users:read

settings:
  event_subscriptions:
    bot_events:
      - message.channels
      - message.groups
      - message.im
      - message.mpim
  interactivity:
    is_enabled: false
  org_deploy_enabled: false
  socket_mode_enabled: true
  token_rotation_enabled: false
